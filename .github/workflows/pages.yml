name: Deploy MarkUp tools (Pages)

# Runs on the repository's DEFAULT branch (the only ref GitHub Pages allows to
# deploy via Actions). Checks out `main` and publishes each app under its path.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r landing/. _site/
          for app in image-annotator:markup damage-assessment:damage-assessment \
                     damage-assessment-large:damage-assessment-large \
                     markup-mini:markup-mini markup-dock:markup-dock \
                     toggle-track:toggle-track toggle-plan:toggle-plan superapp:superapp \
                     quick-crop:quick-crop quick-summary:quick-summary \
                     file-converter:file-converter video-stabiliser:video-stabiliser \
                     breathe:breathe; do
            src="${app%%:*}"; dst="${app##*:}"
            mkdir -p "_site/$dst"; cp -r "$src/." "_site/$dst/"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
