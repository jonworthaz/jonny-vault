<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quick MarkUp — desktop dock</title>
<style>
  /* Self-contained corner-docked markup widget. A launcher button sits at the
     bottom-right; clicking it pops up a compact panel so you can annotate while
     still using other apps (non-blocking — no full-screen backdrop). Embed as a
     small bottom-right iframe, or lift the markup + CSS/JS into the host app. */
  :root{
    --bg:#0f1419; --panel:#1a212b; --panel2:#222c38; --line:#2c3744;
    --text:#e6edf3; --muted:#8b97a5; --accent:#ff5a3c; --ok:#22c55e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  /* page is click-through; only the widget itself catches clicks, so you can
     keep working on whatever is behind it */
  html,body{background:transparent;pointer-events:none}

  .mini-overlay{
    position:fixed; right:16px; bottom:16px; z-index:99999;
    display:flex; flex-direction:column; align-items:flex-end; gap:10px;
  }
  .mini-overlay > *{pointer-events:auto}

  /* launcher button */
  .mini-fab{
    width:56px;height:56px;border-radius:50%;
    background:var(--accent);color:#fff;border:none;cursor:pointer;
    font-size:24px;line-height:1;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .mini-fab:hover{background:#ff6f55}

  .mini-panel{
    display:flex; flex-direction:column;
    width:min(400px,92vw); height:min(520px,80vh);
    background:rgba(26,33,43,.94);
    color:var(--text);
    border:1px solid var(--line); border-radius:14px;
    box-shadow:0 24px 70px rgba(0,0,0,.55);
    overflow:hidden;
    transform-origin:bottom right;
    transition:transform .16s ease, opacity .16s ease;
  }
  .mini-overlay.collapsed .mini-panel{
    transform:scale(.85) translateY(10px); opacity:0; pointer-events:none;
    position:absolute; /* take out of flow while hidden so only the FAB shows */
  }
  .mini-head{
    display:flex; align-items:center; gap:8px;
    padding:8px 10px; border-bottom:1px solid var(--line);
    background:rgba(20,26,34,.6);
  }
  .mini-title{font-size:13px;font-weight:600;margin-right:auto;display:flex;align-items:center;gap:7px}
  .mini-title .dot{color:var(--accent);font-size:16px}
  .mini-x{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 6px;border-radius:6px}
  .mini-x:hover{color:#fff;background:var(--panel2)}

  .mini-tools{
    display:flex; align-items:center; gap:4px; flex-wrap:wrap;
    padding:7px 8px; border-bottom:1px solid var(--line);
  }
  .mini-tools .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
  .mb{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:32px;height:32px;padding:0 8px;
    background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:7px;font-size:15px;cursor:pointer;line-height:1;
  }
  .mb:hover{background:#2b3645}
  .mb.on{border-color:var(--accent);background:#34221d;color:#fff}
  .mb.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .mb.primary:hover{background:#ff6f55}
  .sw{width:20px;height:20px;border-radius:5px;border:2px solid transparent;cursor:pointer}
  .sw.on{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
  .mini-tools input[type=range]{width:74px;accent-color:var(--accent)}

  .mini-stage{
    position:relative;flex:1;min-height:0;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:
      linear-gradient(45deg,#12181f 25%,transparent 25%),
      linear-gradient(-45deg,#12181f 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#12181f 75%),
      linear-gradient(-45deg,transparent 75%,#12181f 75%);
    background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;
    background-color:#0c1116;
  }
  #mCanvas{max-width:100%;max-height:100%;display:none;cursor:crosshair;touch-action:none;box-shadow:0 6px 24px rgba(0,0,0,.5)}
  .mini-empty{color:var(--muted);text-align:center;font-size:14px;padding:24px;line-height:1.5}
  .mini-empty b{color:var(--text)}
  .mini-textin{position:fixed;z-index:100000;background:rgba(0,0,0,.85);border:1px solid var(--accent);color:#fff;border-radius:6px;padding:3px 7px;font-size:15px;display:none}

  :root[data-theme="light"] .mini-panel{background:rgba(255,255,255,.92);color:#17202a;border-color:#d3dae2}
  :root[data-theme="light"] .mini-head,:root[data-theme="light"] .mini-tools{border-color:#d3dae2;background:rgba(240,243,247,.6)}
  :root[data-theme="light"] .mb{background:#eef1f5;border-color:#d3dae2;color:#17202a}
  :root[data-theme="light"] .mb:hover{background:#e6ebf1}
  :root[data-theme="light"] .mini-stage{background-color:#eef1f6;background-image:
      linear-gradient(45deg,#e4e9ef 25%,transparent 25%),
      linear-gradient(-45deg,#e4e9ef 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#e4e9ef 75%),
      linear-gradient(-45deg,transparent 75%,#e4e9ef 75%)}
</style>
</head>
<body>
  <div class="mini-overlay collapsed" id="mOverlay">
    <div class="mini-panel">
      <div class="mini-head">
        <span class="mini-title"><span class="dot">◎</span> Quick MarkUp</span>
        <button class="mb" id="mTheme" title="Day / night">☀️</button>
        <button class="mini-x" id="mClose" title="Minimise" aria-label="Minimise">▾</button>
      </div>

      <div class="mini-tools">
        <button class="mb" id="mUpload" title="Upload / open image">⬆</button>
        <input type="file" id="mFile" accept="image/*" hidden />
        <span class="sep"></span>
        <button class="mb tsel on" data-tool="circle" title="Circle">◯</button>
        <button class="mb tsel" data-tool="rect" title="Box">▢</button>
        <button class="mb tsel" data-tool="highlight" title="Highlight">▦</button>
        <button class="mb tsel" data-tool="arrow" title="Arrow">↗</button>
        <button class="mb tsel" data-tool="pen" title="Draw">✎</button>
        <button class="mb tsel" data-tool="text" title="Text">T</button>
        <button class="mb tsel" data-tool="number" title="Number">①</button>
        <span class="sep"></span>
        <span id="mSwatches" style="display:inline-flex;gap:4px"></span>
        <input type="range" id="mWidth" min="1" max="24" value="5" title="Thickness" />
        <span class="sep"></span>
        <button class="mb" id="mUndo" title="Undo">↶</button>
        <button class="mb" id="mClear" title="Clear all">✕</button>
        <button class="mb" id="mCopy" title="Copy image">⧉</button>
        <button class="mb primary" id="mSave" title="Save PNG">💾</button>
      </div>

      <div class="mini-stage" id="mStage">
        <div class="mini-empty" id="mEmpty">
          <div style="font-size:34px">🖼️</div>
          <b>Upload, paste or drop an image</b><br />then circle, highlight, arrow &amp; number it.
        </div>
        <canvas id="mCanvas"></canvas>
      </div>
    </div>
    <button class="mini-fab" id="mFab" title="Quick MarkUp" aria-label="Open Quick MarkUp">✎</button>
  </div>
  <input type="text" id="mTextIn" class="mini-textin" />

<script>
(() => {
  "use strict";
  const COLORS = ["#ff5a3c","#ffd400","#22c55e","#3b82f6","#ffffff","#111111"];
  const $ = (id) => document.getElementById(id);
  const canvas = $("mCanvas"), ctx = canvas.getContext("2d");
  const stage = $("mStage"), empty = $("mEmpty");

  const st = { img:null, ann:[], tool:"circle", color:COLORS[0], width:5, nextNum:1, undo:[] };

  // ---- image ----
  function loadFile(f){
    if(!f || !f.type.startsWith("image/")) return;
    const r = new FileReader();
    r.onload = e => { const im = new Image(); im.onload = () => setImg(im); im.src = e.target.result; };
    r.readAsDataURL(f);
  }
  function setImg(im){
    st.img = im; canvas.width = im.naturalWidth; canvas.height = im.naturalHeight;
    empty.style.display = "none"; canvas.style.display = "block";
    st.ann = []; st.undo = []; st.nextNum = 1; render();
  }

  // ---- render ----
  function render(){
    if(!st.img) return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(st.img,0,0,canvas.width,canvas.height);
    st.ann.forEach(a => draw(a));
  }
  function draw(a){
    ctx.save(); ctx.lineCap="round"; ctx.lineJoin="round";
    ctx.strokeStyle=a.color; ctx.fillStyle=a.color; ctx.lineWidth=a.w;
    if(a.t==="circle"){ ctx.beginPath(); ctx.ellipse(a.x+a.w2/2,a.y+a.h2/2,Math.abs(a.w2/2),Math.abs(a.h2/2),0,0,Math.PI*2); ctx.stroke(); }
    else if(a.t==="rect"){ ctx.strokeRect(a.x,a.y,a.w2,a.h2); }
    else if(a.t==="highlight"){ ctx.globalAlpha=.3; ctx.fillRect(a.x,a.y,a.w2,a.h2); ctx.globalAlpha=1; }
    else if(a.t==="arrow"){ arrow(a.x,a.y,a.x2,a.y2,a.color,a.w); }
    else if(a.t==="pen"){ ctx.beginPath(); a.pts.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); }
    else if(a.t==="text"){
      const fs=a.fs; ctx.font="600 "+fs+"px -apple-system,Segoe UI,Roboto,sans-serif"; ctx.textBaseline="top";
      const w=ctx.measureText(a.text).width, pad=6;
      ctx.fillStyle="rgba(0,0,0,.6)"; rr(a.x-pad,a.y-pad,w+pad*2,fs+pad*2,5); ctx.fill();
      ctx.fillStyle=a.color; ctx.fillText(a.text,a.x,a.y);
    }
    else if(a.t==="number"){
      const rr2=15; ctx.beginPath(); ctx.arc(a.x,a.y,rr2,0,Math.PI*2); ctx.fillStyle=a.color; ctx.fill();
      ctx.lineWidth=2; ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.stroke();
      ctx.fillStyle=lum(a.color)>150?"#111":"#fff"; ctx.font="700 16px -apple-system,Segoe UI,Roboto,sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(String(a.n),a.x,a.y+1); ctx.textAlign="left";
    }
    ctx.restore();
  }
  function arrow(x1,y1,x2,y2,col,lw){
    const head=Math.max(9,lw*3), ang=Math.atan2(y2-y1,x2-x1);
    ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=lw;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x2,y2);
    ctx.lineTo(x2-head*Math.cos(ang-Math.PI/6),y2-head*Math.sin(ang-Math.PI/6));
    ctx.lineTo(x2-head*Math.cos(ang+Math.PI/6),y2-head*Math.sin(ang+Math.PI/6));
    ctx.closePath(); ctx.fill();
  }
  function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function lum(hex){ const h=hex.replace("#",""); const n=parseInt(h.length===3?h.split("").map(x=>x+x).join(""):h,16); return .299*((n>>16)&255)+.587*((n>>8)&255)+.114*(n&255); }

  // ---- history ----
  function push(){ st.undo.push(JSON.stringify(st.ann)); if(st.undo.length>60) st.undo.shift(); }
  function undo(){ if(!st.undo.length) return; st.ann=JSON.parse(st.undo.pop()); const mx=st.ann.filter(a=>a.t==="number").reduce((m,a)=>Math.max(m,a.n),0); st.nextNum=mx+1; render(); }

  // ---- pointer ----
  let draft=null;
  function pos(e){ const r=canvas.getBoundingClientRect(); return { x:(e.clientX-r.left)*(canvas.width/r.width), y:(e.clientY-r.top)*(canvas.height/r.height) }; }
  canvas.addEventListener("pointerdown", e => {
    if(!st.img) return; canvas.setPointerCapture(e.pointerId);
    const p=pos(e), t=st.tool;
    if(t==="text"){ textAt(p,e); return; }
    if(t==="number"){ push(); st.ann.push({t:"number",x:p.x,y:p.y,n:st.nextNum++,color:st.color}); render(); return; }
    const base={t,color:st.color,w:st.width};
    if(t==="arrow") draft={...base,x:p.x,y:p.y,x2:p.x,y2:p.y};
    else if(t==="pen") draft={...base,pts:[[p.x,p.y]]};
    else draft={...base,x:p.x,y:p.y,w2:0,h2:0};
  });
  canvas.addEventListener("pointermove", e => {
    if(!draft) return; const p=pos(e);
    if(draft.t==="arrow"){ draft.x2=p.x; draft.y2=p.y; }
    else if(draft.t==="pen"){ draft.pts.push([p.x,p.y]); }
    else { draft.w2=p.x-draft.x; draft.h2=p.y-draft.y; }
    render(); draw(draft);
  });
  canvas.addEventListener("pointerup", () => {
    if(!draft) return;
    const trivial = draft.t==="pen" ? draft.pts.length<2 : (Math.abs(draft.w2||0)<3 && Math.abs(draft.h2||0)<3);
    if(!trivial){ push(); st.ann.push(draft); }
    draft=null; render();
  });

  function textAt(p,e){
    const inp=$("mTextIn"); inp.style.display="block"; inp.value="";
    inp.style.left=e.clientX+"px"; inp.style.top=e.clientY+"px"; inp.focus();
    const done=()=>{ const v=inp.value.trim(); inp.style.display="none"; inp.onblur=null; inp.onkeydown=null;
      if(v){ push(); st.ann.push({t:"text",x:p.x,y:p.y,text:v,color:st.color,fs:Math.max(16,st.width*4)}); render(); } };
    inp.onblur=done;
    inp.onkeydown=ev=>{ if(ev.key==="Enter"){ev.preventDefault();done();} if(ev.key==="Escape"){inp.style.display="none";inp.onblur=null;} };
  }

  // ---- flatten / out ----
  function flat(){ render(); return canvas.toDataURL("image/png"); }
  function download(url,name){ const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
  function fname(){ const d=new Date(),p=n=>String(n).padStart(2,"0"); return "markup-"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())+".png"; }
  function save(){ if(st.img) download(flat(),fname()); }
  function copy(){
    if(!st.img) return; render();
    if(navigator.clipboard && window.ClipboardItem){
      canvas.toBlob(b=>{ navigator.clipboard.write([new ClipboardItem({"image/png":b})]).catch(()=>legacyCopy()); },"image/png");
    } else legacyCopy();
  }
  function legacyCopy(){
    try{ const d=document.createElement("div"); d.contentEditable="true"; d.style.cssText="position:fixed;left:-9999px;opacity:0";
      const im=document.createElement("img"); im.src=canvas.toDataURL("image/png"); d.appendChild(im); document.body.appendChild(d);
      const r=document.createRange(); r.selectNode(im); const s=getSelection(); s.removeAllRanges(); s.addRange(r);
      document.execCommand("copy"); s.removeAllRanges(); d.remove(); }catch(_){}
  }

  // ---- ui ----
  function selTool(t){ st.tool=t; document.querySelectorAll(".tsel").forEach(b=>b.classList.toggle("on",b.dataset.tool===t)); }
  (function swatches(){ const w=$("mSwatches"); COLORS.forEach((c,i)=>{ const s=document.createElement("span"); s.className="sw"+(i===0?" on":""); s.style.background=c; s.title=c;
    s.onclick=()=>{ st.color=c; w.querySelectorAll(".sw").forEach(x=>x.classList.remove("on")); s.classList.add("on"); }; w.appendChild(s); }); })();

  $("mUpload").onclick=()=>$("mFile").click();
  $("mFile").onchange=e=>{ if(e.target.files[0]) loadFile(e.target.files[0]); };
  document.querySelectorAll(".tsel").forEach(b=>b.onclick=()=>selTool(b.dataset.tool));
  $("mWidth").oninput=e=>st.width=+e.target.value;
  $("mUndo").onclick=undo;
  $("mClear").onclick=()=>{ if(st.ann.length){ push(); st.ann=[]; render(); } };
  $("mCopy").onclick=copy;
  $("mSave").onclick=save;
  const overlay=$("mOverlay");
  const setOpen=(open)=>{ overlay.classList.toggle("collapsed",!open); $("mFab").style.display=open?"none":"block";
    if(window.parent!==window) window.parent.postMessage({type:open?"quickmarkup:open":"quickmarkup:close"},"*"); };
  $("mFab").onclick=()=>setOpen(true);
  $("mClose").onclick=()=>setOpen(false);
  setOpen(false); // start docked/minimised — just the launcher shows

  // theme
  const applyTheme=t=>{ document.documentElement.setAttribute("data-theme",t); $("mTheme").textContent=t==="light"?"🌙":"☀️"; };
  let theme="dark"; try{ theme=localStorage.getItem("markup-theme")||"dark"; }catch(_){}
  applyTheme(theme);
  $("mTheme").onclick=()=>{ theme=document.documentElement.getAttribute("data-theme")==="light"?"dark":"light"; applyTheme(theme); try{localStorage.setItem("markup-theme",theme);}catch(_){} };

  // drop onto the panel (the page itself is click-through) + paste anywhere
  const dz=$("mStage");
  ["dragenter","dragover"].forEach(ev=>dz.addEventListener(ev,e=>e.preventDefault()));
  dz.addEventListener("drop",e=>{ e.preventDefault(); if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });
  window.addEventListener("paste",e=>{ for(const it of (e.clipboardData?.items||[])) if(it.type.startsWith("image/")){ loadFile(it.getAsFile()); break; } });
})();
</script>
</body>
</html>
